name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier que index.html est à jour (et la banque valide)
        run: python tools/build.py --check

      - name: Installer les dépendances de test
        run: npm ci

      - name: Lancer les tests
        run: npm test
